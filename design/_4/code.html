<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>

<title>Handong Donor Wall - Admin Portal</title>

                        "surface-container-high": "#eae8e7",
                        "error-container": "#ffdad6",
                        "secondary-container": "#ffdfa0",
                        "tertiary": "#41413e",
                        "on-secondary-container": "#79612e",
                        "surface-bright": "#fbf9f8",
                        "surface-container-lowest": "#ffffff",
                        "deep-navy": "#003D6B",
                        "inverse-on-surface": "#f2f0f0",
                        "surface-variant": "#e4e2e2",
                        "surface-container-highest": "#e4e2e2",
                        "on-surface": "#1b1c1c",
                        "inverse-surface": "#303030",
                        "pale-gold": "#E5D4B1",
                        "on-secondary-fixed": "#261a00",
                        "surface": "#fbf9f8",
                        "secondary-fixed-dim": "#e1c386",
                        "on-primary": "#ffffff",
                        "outline": "#717781",
                        "tertiary-container": "#595955",
                        "border-subtle": "#E2E2E2",
                        "primary": "#005b9a",
                        "on-tertiary-container": "#d1cfcb",
                        "on-tertiary-fixed": "#1b1c19",
                        "on-background": "#1b1c1c",
                        "on-tertiary-fixed-variant": "#474744",
                        "on-primary-container": "#afd2ff",
                        "primary-fixed-dim": "#9ecaff",
                        "secondary": "#725b29",
                        "on-primary-fixed": "#001d36",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f5f3f3",
                        "outline-variant": "#c1c7d2",
                        "on-secondary-fixed-variant": "#584413",
                        "primary-container": "#005b9a",
                        "surface-container": "#efeded",
                        "inverse-primary": "#9ecaff",
                        "tertiary-fixed-dim": "#c8c6c2",

                    "borderRadius": {

                    "spacing": {

                    "fontFamily": {

<style>
        body {
            background-color: #f1f4f9;
            font-family: 'Noto Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-elevation {
            box-shadow: 0 10px 40px -10px rgba(0, 91, 154, 0.1);
        }
        .input-focus-ring:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 91, 154, 0.2);
            border-color: #005b9a;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-gutter">
<div class="w-full max-w-[440px]">
<!-- Branding Header -->
<div class="text-center mb-8">
<div class="flex flex-col items-center gap-6">
<img alt="Handong Global University" class="h-14 object-contain" src="https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg"/>
<div>
<h1 class="font-headline-md text-headline-md text-on-surface">관리자 로그인</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">발전기금 관리 시스템에 접속합니다.</p>
</div>
</div>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest p-8 md:p-10 rounded-2xl soft-elevation border border-outline-variant/30">
<form class="space-y-6" id="loginForm">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block font-label-lg text-label-lg text-on-surface-variant" for="email">이메일 계정</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl">account_circle</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface transition-all input-focus-ring" id="email" name="email" placeholder="example@handong.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="block font-label-lg text-label-lg text-on-surface-variant" for="password">비밀번호</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">비밀번호 초기화</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl">lock</span>
<input class="w-full pl-12 pr-12 py-3.5 bg-surface-container-low border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface transition-all input-focus-ring" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-xl" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Options -->
<div class="flex items-center space-x-2">
<input class="w-4 h-4 text-primary bg-surface border-outline-variant rounded focus:ring-primary transition-colors" id="remember" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-surface-variant cursor-pointer select-none" for="remember">로그인 정보 저장</label>
</div>
<!-- Primary Action -->
<button class="w-full py-4 bg-primary text-on-primary font-label-lg text-label-lg rounded-xl hover:bg-opacity-90 active:scale-[0.99] transition-all shadow-md shadow-primary/20 flex items-center justify-center gap-2" type="submit">
<span>로그인</span>
<span class="material-symbols-outlined text-xl">login</span>
</button>
</form>
<!-- Security Notice -->
<div class="mt-10 pt-6 border-t border-outline-variant/30 text-center">
<div class="flex flex-col items-center gap-2">
<p class="font-label-sm text-label-sm text-outline flex items-center justify-center gap-1.5">
<span class="material-symbols-outlined text-base">verified_user</span>
                            보안 프로토콜 적용 중 (SSL 256-bit)
                        </p>
</div>
</div>
</div>
<!-- Portal Links (Refined Style) -->
<div class="mt-8 flex flex-wrap justify-center gap-x-6 gap-y-2">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary hover:underline transition-all flex items-center gap-1" href="https://sarang.handong.edu">
                    발전기금 안내
                </a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary hover:underline transition-all flex items-center gap-1" href="https://www.handong.edu">
                    한동대학교 공식 홈페이지
                </a>
</div>
</div>
</main>
<!-- Footer from Shared Components -->
<footer class="w-full mt-auto bg-surface-container-highest border-t border-outline-variant/30">
<div class="max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop py-8 flex flex-col md:flex-row justify-between items-center gap-6">
<div class="text-headline-md font-headline-md text-on-surface opacity-80">Handong Global University</div>
<div class="flex flex-col md:flex-row items-center gap-6">
<div class="flex gap-6">
<a class="text-label-sm font-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Contact Us</a>
<a class="text-label-sm font-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
</div>
<div class="text-label-sm font-label-sm text-on-surface-variant/70">
                    © 2024 Handong Global University. All rights reserved.
                </div>
</div>
</div>
</footer>
<script>
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordField.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Interaction feedback
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            btn.disabled = true;
            btn.classList.add('opacity-80');

            setTimeout(() => {
                // Mock success behavior
                btn.innerHTML = originalContent;
                btn.disabled = false;
                btn.classList.remove('opacity-80');
                alert('정상적으로 인증되었습니다. 대시보드로 이동합니다.');
            }, 1200);
        });
    </script>
</body></html>
